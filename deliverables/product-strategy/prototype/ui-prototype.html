<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meme雷达 · 淘汰机器 · 共振证据台（UI 原型）</title>
<style>
/* ============================================================
   meme-radar UI 原型 · 规格 ps-ui-spec.md §3 视觉语言规范
   约束：单文件 / 无外部资源 / 无框架 / 所有显式字号 >= 14px
   ============================================================ */

:root{
  color-scheme: dark;
  /* —— 既有 13 个 Token，值一个都不改（规格 §3.1）—— */
  --bg:#06090b;
  --panel:#0d1519;
  --panel-strong:#111e24;
  --line:#27424c;
  --line-soft:#1b3038;
  --text:#eef8f5;
  --muted:#9bb0aa;
  --green:#43efaa;
  --red:#ff6c7c;
  --amber:#ffd064;
  --cyan:#5ce5f2;
  --blue:#77aaff;
  --shadow:#0008;
  /* —— 新增 Token：统一 --x-* 前缀，追加在末尾（规格 §3.1）—— */
  --x-unknown-ink:#7d939b;   /* 未知文字：冷灰，绝不与 green 相邻 */
  --x-unknown-line:#3a4f57;  /* 未知的虚线下划线 */
  --x-struck-bg:#0a1014;     /* 被划掉卡背景：比 panel 更后退 */
  --x-struck-ink:#6d8079;    /* 被划掉文字：可读但明显退后 */
  --x-stale-tint:#171410;    /* 陈旧数据叠层：amber 极低饱和 */
  --x-cyan-wash:#0e1b20;     /* 结论层/锚点行的极淡底，替代"绿底=安全" */
  --x-focus:#5ce5f2;         /* 焦点环 */
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px;
  line-height:1.5;
  /* 暗色径向渐变 #15372d + 42px 网格纹理；无装饰动画（规格禁止装饰性扫描线） */
  background:
    radial-gradient(1200px 720px at 50% -12%, #15372d 0%, rgba(21,55,45,0) 62%),
    linear-gradient(0deg, rgba(255,255,255,.014) 1px, transparent 1px) 0 0 / 42px 42px,
    linear-gradient(90deg, rgba(255,255,255,.014) 1px, transparent 1px) 0 0 / 42px 42px,
    var(--bg);
}

.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

/* —— 排版阶梯 T1–T6（规格 §3.2.1），最小 14px —— */
.t1{font-size:26px;line-height:1.2;font-weight:600}
.t2{font-size:20px;line-height:1.25;font-weight:600}
.t3{font-size:17px;line-height:1.35;font-weight:600}
.t4{font-size:16px;line-height:1.5;font-weight:400}
.t5{font-size:15px;line-height:1.45;font-weight:600}
.t6{font-size:14px;line-height:1.4;font-weight:400}

.muted{color:var(--muted)}
.cyan{color:var(--cyan)}
.blue{color:var(--blue)}
.amber{color:var(--amber)}
.red{color:var(--red)}
.green{color:var(--green)}
.up{color:var(--green)}
.down{color:var(--red)}

a{color:var(--blue)}

/* —— 焦点环（规格 §3.4）—— */
:focus-visible{outline:2px solid var(--x-focus);outline-offset:2px}

.skip-link{
  position:absolute;left:-9999px;top:0;z-index:60;
  background:var(--panel-strong);color:var(--text);
  padding:8px 14px;border:1px solid var(--cyan);border-radius:6px;font-size:14px;
}
.skip-link:focus{left:8px;top:8px}

.shell{max-width:1440px;margin:0 auto;padding:0 20px 40px}

/* ============================================================
   L3 停摆横幅（C10 · 绝对不可关闭）
   ============================================================ */
.banner{
  border:1px solid var(--red);
  border-left:3px solid var(--red);
  background:linear-gradient(0deg, rgba(255,108,124,.10), rgba(255,108,124,.10)), var(--panel);
  border-radius:10px;padding:12px 18px;margin:18px 0;
}
.banner-title{font-size:16px;font-weight:700;color:var(--red)}
.banner-line{font-size:14px;color:var(--text);margin-top:4px}
.banner-note{font-size:14px;color:var(--muted);margin-top:4px}

/* L2 不可关告警（内联条） */
.alert-inline{
  border:1px solid var(--amber);
  border-left:3px solid var(--amber);
  background:var(--x-stale-tint);
  border-radius:10px;padding:10px 18px;margin:18px 0;
  font-size:14px;color:var(--amber);
}

/* ============================================================
   顶栏
   ============================================================ */
.topbar{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  min-height:64px;padding:12px 0;border-bottom:1px solid var(--line);
}
.brand-title{font-size:26px;font-weight:600;letter-spacing:.2px}
.brand-sub{font-size:14px;color:var(--muted)}
.chain-switch{display:flex;gap:6px}
.chain-btn{
  font-size:14px;padding:4px 12px;border-radius:4px;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);color:var(--muted);
  font-family:inherit;min-height:28px;
}
.chain-btn[aria-pressed="true"]{color:var(--text);border-color:var(--cyan);background:var(--x-cyan-wash)}
.clocks{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-left:auto;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--green)}
.dot-degraded{background:var(--amber)}
.dot-down{background:var(--red)}
.alive-label{font-size:14px}
.toggle-line{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}

/* ============================================================
   C1 结论层 · 规格 §4.1
   ============================================================ */
.verdict-bar{
  margin-top:18px;background:var(--panel-strong);
  border:1px solid var(--cyan);border-left:3px solid var(--cyan);
  border-radius:10px;padding:14px 18px;box-shadow:0 2px 10px var(--shadow);
}
.verdict-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.verdict-head h2{margin:0;font-size:17px;font-weight:600;color:var(--cyan)}
.verdict-list{list-style:none;margin:10px 0 0;padding:0}
.verdict-row{
  display:grid;grid-template-columns:24px 118px 132px minmax(0,1fr) 28px;
  gap:10px;align-items:baseline;min-height:30px;padding:3px 6px;border-radius:4px;cursor:pointer;
}
.verdict-row:hover{background:var(--x-cyan-wash)}
.verdict-row .vrank{font-size:14px;color:var(--muted);text-align:right}
.verdict-row .vsym{font-size:17px;font-weight:600;color:var(--text);overflow-wrap:anywhere}
.verdict-row .vsym .chain-tag{font-size:14px;font-weight:400;color:var(--muted);margin-left:4px}
.verdict-row .vreason{font-size:16px;color:var(--text)}
.verdict-row .vgo{font-size:14px;color:var(--blue);text-align:right}
.verdict-tail{font-size:14px;color:var(--muted);margin-top:8px}
.verdict-bar.is-disabled{filter:grayscale(1);opacity:.75}
.verdict-bar.is-disabled .verdict-row{cursor:not-allowed}
.verdict-bar.is-stale .verdict-list{filter:saturate(.55)}
.skeleton-row{height:30px;background:var(--panel-strong);border-radius:4px;margin:6px 0}

/* ============================================================
   C2 报数行 · 规格 §4.2
   ============================================================ */
.ledger{
  margin-top:18px;border:1px solid var(--line);background:var(--panel);
  border-radius:10px;padding:10px 18px;
}
.ledger-line{font-size:14px;color:var(--muted);padding:3px 0;display:flex;gap:14px;flex-wrap:wrap}
.ledger-line .n{font-size:16px;font-weight:600;color:var(--text)}
.ledger-line .n-struck{color:var(--amber)}
.ledger-line .n-kept{color:var(--x-unknown-ink);border-bottom:1px dashed var(--x-unknown-line)}
.ledger-line .n-veto{color:var(--red)}
.ledger-line .n-zero{color:var(--amber)}
.ledger-line .label{font-size:14px;color:var(--muted)}
.ledger.is-frozen{border-left:3px solid var(--amber)}
.ledger.is-conflict{background:var(--x-stale-tint);border-color:var(--amber)}
.ledger-conflict-prefix{font-size:14px;font-weight:700;color:var(--amber)}

/* ============================================================
   唯一的币种网格 · 规格 §2.3（全页 class="token-grid" 有且仅有一个）
   ============================================================ */
.board{margin-top:18px}
.board-toolbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  font-size:14px;color:var(--muted);padding-bottom:10px;
}
.board-toolbar select,.board-toolbar input[type=checkbox]{font-size:14px;font-family:inherit}
.board-toolbar select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:3px 6px;min-height:28px}
.token-grid{display:flex;flex-direction:column;gap:18px}
.grid-section{background:transparent}
.grid-section-head{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:17px;font-weight:600;color:var(--text);padding:6px 0;border-bottom:1px solid var(--line-soft);
}
.grid-section-head .count{font-size:14px;color:var(--muted);font-weight:400}
.token-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:1000px){.token-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.token-cards{grid-template-columns:1fr}}

/* ============================================================
   C3 主卡片 · 规格 §4.3
   ============================================================ */
.card{
  position:relative;background:var(--panel-strong);border:1px solid var(--line);
  border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;
}
.card-verdict{border-color:var(--cyan);border-left:3px solid var(--cyan);box-shadow:0 2px 10px var(--shadow)}
.card-struck{background:var(--x-struck-bg);border-color:var(--line-soft)}
.card.is-stale{filter:saturate(.55)}
.card.is-target{animation:liveArrival 1.1s ease-out 1}
@keyframes liveArrival{
  0%{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan)}
  100%{border-color:var(--line);box-shadow:none}
}
.card[aria-current="true"]{outline:2px solid var(--cyan);outline-offset:2px}

.c-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.c-symbol{font-size:20px;font-weight:600;color:var(--text);overflow-wrap:anywhere}
.c-symbol .chain-tag{font-size:14px;font-weight:400;color:var(--muted);margin-left:6px}
.c-addr{font-size:14px;color:var(--muted);overflow-wrap:anywhere;margin-top:4px}
.c-age{font-size:14px;text-align:right;white-space:nowrap}
.c-age-fresh{color:var(--muted)}
.c-age-warn{color:var(--amber)}
.c-age-stale{color:var(--red)}

.c-badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{
  font-size:14px;font-weight:700;min-width:24px;height:18px;line-height:18px;
  border-radius:4px;padding:0 7px;display:inline-block;white-space:nowrap;text-align:center;
}
.badge-s{background:#4d2a22;color:#ffbe9a}
.badge-a{background:#3c2a20;color:#ffd064}
.badge-b{background:#22333d;color:#9bd0e8}
.badge-c{background:#332f27;color:#c9c0a4}
.badge-d{background:#2a2a2a;color:#b9b9b9}
.badge-quad{border:1px solid var(--line);background:transparent;font-weight:600}
.quad-watch{background:#233540}
.quad-breakout{background:#1d3b33}
.quad-distribution{background:#43302c}
.quad-pool{background:#432b32}
.chip{
  font-size:14px;border-radius:999px;padding:2px 7px;border:1px solid currentColor;
  display:inline-block;white-space:nowrap;color:var(--muted);
}
.chip-stage{color:var(--muted)}
.chip-open{color:var(--green)}
.chip-close{color:var(--amber)}
.chip-keep{color:var(--cyan)}
.chip-drop{color:var(--blue)}
.chip-synth{color:var(--x-unknown-ink);border-style:dashed}

.c-anchor{font-size:14px;color:var(--muted);padding-top:8px;border-top:1px solid var(--line-soft)}
.c-anchor .val{color:var(--text)}

/* 变化轴行：标签 / 旧 → 新 / 倍数 */
.c-axes{display:flex;flex-direction:column;gap:6px}
.axis-row{
  display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:10px;align-items:baseline;font-size:14px;
}
.axis-row .ax-label{font-size:14px;color:var(--muted)}
.axis-row .ax-pair{font-size:16px;color:var(--text)}
.axis-row .ax-mult{font-size:16px;font-weight:600;text-align:right}
.axis-row .ax-basis{font-size:14px;color:var(--cyan)}

.c-smart{font-size:14px;color:var(--text)}
.c-evidence{border-top:1px solid #29404a;padding-top:8px;display:flex;flex-direction:column;gap:6px}
.evidence-row{font-size:14px;color:#d9bd80}

.c-cluster,.c-security,.c-timeline{
  border-top:1px solid var(--line-soft);padding-top:8px;
}
.cluster-head{font-size:16px;color:var(--text);display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.wallet-row{font-size:14px;color:var(--muted);padding-inline-start:14px;margin-top:6px}
.wallet-row .pfx{color:var(--line);margin-right:4px}
.wallet-row .val{color:var(--text)}

.c-chips{font-size:14px;color:var(--text);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.c-chips .seg{white-space:nowrap}
.c-chips .dir{color:var(--muted)}
.c-dev{font-size:14px;color:var(--text)}
.c-dev.is-risk{color:var(--red)}

.security-summary{font-size:14px;color:var(--text);cursor:pointer}
.security-note{font-size:14px;color:var(--muted);margin:4px 0 8px}
.sec-row{
  display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;
  align-items:baseline;font-size:14px;padding:3px 0;
}
.sec-row .sec-name{font-size:14px;color:var(--muted)}
.sec-row .sec-val{font-size:14px;color:var(--text)}
.sec-row .sec-basis{font-size:14px;color:var(--cyan);white-space:nowrap}
.sec-notapplicable{font-size:14px;color:var(--x-unknown-ink)}

.c-timeline summary{font-size:14px;color:var(--text);cursor:pointer}
.timeline-row{font-size:14px;color:var(--muted);margin-top:6px}
.c-score{font-size:14px;color:var(--text);border-top:1px solid var(--line-soft);padding-top:8px}
.c-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line-soft)}
.mini-btn{
  font-size:14px;font-family:inherit;min-height:28px;padding:3px 10px;
  background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--muted);cursor:pointer;
}
.mini-btn:hover{color:var(--text)}
.mini-btn-link{color:var(--blue)}

/* C4 未知三件套（规格 §3.1.1 / §4.4） */
.gap{color:var(--x-unknown-ink);border-bottom:1px dashed var(--x-unknown-line);font-size:14px}
.gap-not-fetched{border-left:2px solid var(--amber);padding-inline-start:4px}
.gap-note{font-size:14px;color:var(--x-unknown-ink);margin-inline-start:6px}

/* ============================================================
   C7 今日淘汰清单（同一网格的第 4 个分段）
   ============================================================ */
.struck-list{margin-top:12px;display:flex;flex-direction:column;gap:4px}
.struck-row{
  display:grid;grid-template-columns:110px minmax(0,1fr) 96px 72px minmax(0,1fr) auto;
  gap:10px;align-items:center;font-size:14px;
  background:var(--x-struck-bg);border:1px solid var(--line-soft);border-radius:6px;padding:4px 10px;min-height:36px;
}
.struck-row .s-sym{color:var(--x-struck-ink);text-decoration:line-through;overflow-wrap:anywhere}
.struck-row .s-addr{font-size:14px;color:var(--muted)}
.struck-row .s-clock{font-size:14px;color:var(--muted)}
.struck-row .s-tail{font-size:14px;color:var(--muted)}
.chip-veto{color:var(--red)}
.chip-zeroed{color:var(--red)}
.chip-quiet{color:var(--amber)}
.chip-stale{color:var(--amber)}
.chip-manual{color:var(--blue)}
.struck-reasons{font-size:14px;color:var(--muted);padding:6px 10px 10px 120px}

/* ============================================================
   页脚三面板（非币种网格：不含 data-card-key）
   ============================================================ */
.footers{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 18px}
.panel summary{font-size:17px;font-weight:600;color:var(--text);cursor:pointer;display:flex;gap:10px;align-items:baseline}
.panel summary .count{font-size:14px;color:var(--muted);font-weight:400}
.panel.is-abnormal{border-color:var(--red)}
.panel.is-abnormal summary .count{color:var(--red)}
.panel-note{font-size:14px;color:var(--muted);margin:8px 0}
.panel table{width:100%;border-collapse:collapse;font-size:14px}
.panel th,.panel td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
.panel th{color:var(--muted);font-weight:400}
.panel td.num{text-align:right}
.table-scroll{overflow-x:auto}
.pill{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.pill-ready{background:var(--green)}
.pill-degraded{background:transparent;border:2px solid var(--amber)}
.pill-down{background:var(--red)}
.pill-notwired{background:transparent;border:2px dashed var(--muted)}
.pill-retired{background:var(--muted);text-decoration:line-through}

/* ============================================================
   C10 Toast
   ============================================================ */
.toast{
  position:fixed;right:20px;bottom:20px;z-index:70;
  background:var(--panel-strong);border:1px solid var(--line);border-radius:10px;
  padding:10px 16px;font-size:14px;color:var(--text);box-shadow:0 6px 18px var(--shadow);
  opacity:0;transform:translateY(8px);transition:opacity 160ms linear,transform 160ms linear;pointer-events:none;
}
.toast.is-on{opacity:1;transform:translateY(0)}

/* ============================================================
   原型元控件（不属于产品本身）：视觉弱化 + 虚线 + 标注"原型控件"
   ============================================================ */
.proto-bar{
  display:flex;gap:14px;flex-wrap:wrap;align-items:center;
  border:1px dashed var(--x-unknown-line);border-radius:10px;
  background:rgba(13,21,25,.6);padding:10px 14px;margin:18px 0 0;
}
.proto-tag{font-size:14px;color:var(--x-unknown-ink);border-bottom:1px dashed var(--x-unknown-line)}
.proto-group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.proto-btn{
  font-size:14px;font-family:inherit;min-height:28px;padding:3px 10px;cursor:pointer;
  background:transparent;border:1px dashed var(--x-unknown-line);border-radius:4px;color:var(--x-unknown-ink);
}
.proto-btn[aria-pressed="true"]{color:var(--text);border-style:solid;border-color:var(--line);background:var(--panel)}
.proto-state-desc{font-size:14px;color:var(--muted);width:100%}
.accept-panel{margin-top:12px}
.accept-item{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14px}
.accept-item input[type=checkbox]{margin-top:4px}
.accept-item .no{font-size:14px;font-weight:600;color:var(--cyan);white-space:nowrap}
.accept-progress{font-size:14px;color:var(--muted);margin-top:8px}

/* 骨架屏（S2 正在扫描）：无 spinner、无 shimmer */
.skeleton-card{background:var(--panel-strong);border:1px solid var(--line);border-radius:10px;height:264px}
.skeleton-block{background:var(--panel-strong);border-radius:4px;height:14px}
.empty-note{font-size:16px;color:var(--text);padding:14px;border:1px dashed var(--line);border-radius:10px;background:var(--panel)}
</style>
</head>
<body>
<a class="skip-link" href="#board">跳到看板</a>

<div class="shell">

  <!-- 原型元控件（不属于产品）：状态演示切换器 + 验收对照 -->
  <div class="proto-bar" role="group" aria-label="原型控件">
    <span class="proto-tag">原型控件</span>
    <span class="proto-group" id="stateSwitcher" role="group" aria-label="状态演示切换器"></span>
    <span class="proto-state-desc" id="stateDesc"></span>
  </div>

  <div class="proto-bar accept-panel" role="group" aria-label="原型控件">
    <span class="proto-tag">原型控件</span>
    <details style="width:100%">
      <summary class="muted" style="font-size:14px;font-weight:400;cursor:pointer">验收对照 · 瑞思 §6 十二条验收句（逐条亲手判定）</summary>
      <div id="acceptList" style="margin-top:10px"></div>
      <div class="accept-progress" id="acceptProgress"></div>
    </details>
  </div>

  <!-- L3 停摆横幅（仅 S4 出现；绝对不可关闭、不可折叠） —— C10 -->

function money(v){
  if (v === null || v === undefined || !isFinite(v)) return null;
  const a = Math.abs(v);
  if (a >= 1e9) return '$' + (v/1e9).toFixed(1) + 'B';
  if (a >= 1e6) return '$' + (v/1e6).toFixed(1) + 'M';
  if (a >= 1e3) return '$' + (v/1e3).toFixed(1) + 'K';
  return '$' + v.toFixed(0);
}
function price(v){ if (v === null || v === undefined || !isFinite(v)) return null; return '$' + Number(v.toPrecision(3)).toString(); }
function int(v){ return v === null || v === undefined ? null : String(Math.round(v)); }
function rate(v){ return v === null || v === undefined || !isFinite(v) ? null : v.toFixed(2); }
function mult(oldV, newV){
  if (oldV === null || oldV === undefined || newV === null || newV === undefined) return null;
  if (!isFinite(oldV) || !isFinite(newV) || oldV === 0) return null;   // 不可算 → 留空，不是 ×1.00
  return '×' + (newV/oldV).toFixed(2);
}
function dirMark(oldV, newV){ if (oldV === null || newV === null) return ''; return newV > oldV ? '▲' : (newV < oldV ? '▼' : '·'); }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  const t      = hhmm(card.lastAt);

    items.push({ name, known, html, basis: 'basis=' + route + '@' + (clock || t) });
  };

  if (isBsc){
    add('rug 概率', false, GAP.unevaluated('BSC 该字段恒 0，不可信，不作答（恒 0 比缺失更危险）'), 'trending');
  } else {
    add('rug 概率', vals.rug != null, vals.rug != null ? rate(vals.rug) : GAP.notFetched('trending 行本轮未返回 rug_ratio'), 'trending');
  }

  add('老鼠仓', vals.rat != null,     vals.rat     != null ? rate(vals.rat)    : GAP.notFetched('trending 行本轮未返回 rat_trader_amount_rate'), 'trending');
  add('捆绑',   vals.bundler != null, vals.bundler != null ? rate(vals.bundler): GAP.notFetched('trending 行本轮未返回 bundler_rate'), 'trending');
  // 前10占比 —— BSC 取真实 top_10_holder_rate，取不到走「未取到」
  const top10 = isBsc ? card.latest.top10Rate : vals.top10;
  add('前10占比', top10 != null, top10 != null ? rate(top10) : GAP.notFetched('该行未返回 top_10_holder_rate'), 'trending');
  // 买卖税 / 弃权锁仓 / 开源 / 黑名单 —— security 路由（w1）

  // 蜜罐 —— SOL 恒 null（概念不适用，整行不印）；BSC 返回 −1 → 未评估（不得当 false）
  if (isBsc){
    add('蜜罐', false, GAP.unevaluated('BSC 返回 −1，−1 不等于「未蜜罐」，不作答'), 'security');
  }
  add('开源',   vals.openSource != null, vals.openSource != null ? String(vals.openSource) : GAP.notFetched('GET /v1/token/security 本轮未触发'), 'security');
  add('黑名单', vals.blacklist != null,  vals.blacklist  != null ? String(vals.blacklist)  : GAP.notFetched('GET /v1/token/security 本轮未触发'), 'security');
  // renounced_mint / renounced_freeze_account：BSC 恒 false（EVM 无此概念）→ 整行不印
  return items;
}

/* ---------- C1 结论层理由句（数字必须能在同卡上逐字指到） ---------- */
function verdictReason(card){
  const perWallet = card.cluster ? Math.round(card.cluster.amountUsd / card.cluster.wallets) : 0;
  if (card.verdictRank === 1 && card.cluster){
    return '7 钱包 ' + hhmm(card.cluster.at) + ' 同向买入 · 均额 ' + money(perWallet) + ' · 信号 rung 7';
  }
  if (card.verdictRank === 2 && card.cluster){
    const t1 = card.cluster.spanFrom ? hhmm(card.cluster.spanFrom) : hhmm(card.cluster.at);
    const t2 = card.cluster.spanTo ? hhmm(card.cluster.spanTo) : hhmm(card.cluster.at);
    return '3 钱包 ' + t1 + '–' + t2 + ' 同向买入 · 均额 ' + money(perWallet) + ' · 聪明钱 3';
  }
  if (card.verdictRank === 3 && card.cluster){
    const m = axesOf(card.snap, card.latest, card.priceKnown);
    const cap = m.find(a => a.label === '市值'), liq = m.find(a => a.label === '流动性');
    return '市值 ' + (cap ? cap.mult : '未印') + ' · 流动性 ' + (liq ? liq.mult : '未印') + ' · 3 钱包 ' + hhmm(card.cluster.at) + ' 同向买入';
  }
  if (card.verdictRank === 4 && card.cluster){
    return '3 钱包 ' + hhmm(card.cluster.at) + ' 同向买入 · 均额 ' + money(perWallet) + ' · 前10占比 ' + rate(card.latest.top10Rate);
  }
  const hold = axesOf(card.snap, card.latest, card.priceKnown).find(a => a.label === '持币');
  return '持币 ' + (hold ? hold.mult : '未印') + ' · 首见 ' + hhmm(card.firstAt) + ' · 首见市值 ' + money(card.snap.marketCap);
}

/* ============================================================================
   C3 主卡片（规格 §4.3）
   ============================================================================ */
function renderCard(card){
  const f = flags();
  const ageMin = Math.max(0, Math.round((NOW_MS - card.lastAt) / 60000));
  const stale  = f.banned || ageMin > 30;
  const ageClass = stale ? 'c-age-stale' : (ageMin > 5 ? 'c-age-warn' : 'c-age-fresh');
  const ageText  = '数据年龄 ' + ageMin + 'm' + (stale ? ' · 陈旧' : '');
  const axes = axesOf(card.snap, card.latest, card.priceKnown);
  const t = hhmm(card.lastAt);
  const isVerdict = card.group === 'verdict';

  let h = '';
  h += '<article class="card' + (isVerdict ? ' card-verdict' : '') + (stale ? ' is-stale' : '') + '"'
     + ' data-card-key="' + esc(card.key) + '" data-group="' + esc(card.group) + '" tabindex="0">';

  /* —— 3.1 标识区 —— */
  h += '<div class="c-head">';
  h +=   '<div>';
  h +=     '<div class="c-symbol">' + esc(card.symbol)
        + '<span class="chain-tag">' + '<span style="color:' + (card.chain === 'sol' ? 'var(--cyan)' : 'var(--amber)') + '">●</span> ' + card.chain.toUpperCase() + '</span></div>';
  h +=     '<div class="c-addr mono">' + esc(card.address) + '</div>';
  h +=   '</div>';
  h +=   '<div class="c-age ' + ageClass + '">' + esc(ageText) + '</div>';
  h += '</div>';

  /* —— 3.2/3.3 徽章区：评级 · 象限 · 阶段 · 示例 · 手动标记 —— */
  h += '<div class="c-badges">';
  if (card.grade) h += '<span class="badge badge-' + card.grade.toLowerCase() + '" title="评级只表示证据量档位，不表示好坏">'
        + card.grade + '</span>';
  const quadName = { WATCH:'观察', BREAKOUT:'真启动', DISTRIBUTION:'出货', POOL_PULLED:'撤池' }[card.quadrant] || card.quadrant;
  h += '<span class="badge badge-quad quad-' + card.quadrant.toLowerCase() + '" title="象限看池子、钱包簇看钱包，两者是两条不同的测量，方向相反时以钱包簇的时间更近者为准">'
        + quadName + '</span>';
  const stageText = card.stage.kind === 'near' ? ('临毕业 ' + card.stage.pct + '%')
                  : card.stage.kind === 'done' ? ('已毕业 · ' + card.stage.cost) : '新池';
  h += '<span class="chip chip-stage" title="阶段是中性事实，不配色">' + esc(stageText) + '</span>';
  if (card.synth) h += '<span class="chip chip-synth" title="本卡含 GMGN 单源化后才有的字段，当前运行实例尚未取到，用同构合成值补齐">示例</span>';
  if (marks[card.address] && marks[card.address].mark === 'keep') h += '<span class="chip chip-keep">保留</span>';
  h += '</div>';

  /* —— 3.4 首见锚点行：缺首见则整行不印 —— */
  if (card.firstAt){
    const sinceMin = Math.max(0, Math.round((NOW_MS - card.firstAt) / 60000));
    h += '<div class="c-anchor">首见 <span class="mono val">' + esc(dayhhmm(card.firstAt)) + '</span>'
       + ' · 首见市值 <span class="mono val">' + esc(money(card.snap.marketCap)) + '</span>'
       + ' · 首见起 <span class="mono val">' + sinceMin + 'm</span>'
       + ' · <span class="cyan mono">basis=' + esc(card.anchorBasis) + '</span></div>';
  }

  /* —— 3.5 变化轴行：两侧全无 → 整行不印；单侧有 → 不印 —— */
  if (axes.length){
    h += '<div class="c-axes">';
    for (const a of axes){
      h += '<div class="axis-row">'
         +   '<span class="ax-label">' + esc(a.label) + '</span>'
         +   '<span class="ax-pair mono">' + esc(a.old) + ' &nbsp;→&nbsp; ' + esc(a.now)
         +     ' <span class="' + (a.up ? 'up' : 'down') + '">' + a.dir + '</span>'
         +     ' <span class="ax-basis mono">basis=' + esc(card.source === 'market' ? 'trending' : card.source) + '@' + t + '</span></span>'
         +   '<span class="ax-mult mono ' + (a.up ? 'up' : 'down') + '">' + (a.mult ? esc(a.mult) : '') + '</span>'
         + '</div>';
    }
    h += '</div>';
  }

  /* —— 聪明钱 / KOL 计数行：未检测到 → 整行不印（不是 0） —— */
  if (card.smart){
    h += '<div class="c-smart">聪明钱 <span class="mono">' + card.smart.degen + '</span>'
       + ' · KOL <span class="mono">' + card.smart.kol + '</span>'
       + ' <span class="cyan mono" style="font-size:14px">basis=trending@' + t + '</span></div>';
  }

  /* —— 3.6 证据区：每条带读数与时刻；holders 类永远排最后 —— */
  if (card.evidence && card.evidence.length){
    const ev = card.evidence.slice().sort((a, b) => (a.axis === 'holders' ? 1 : 0) - (b.axis === 'holders' ? 1 : 0));
    h += '<div class="c-evidence">';
    for (const e of ev){
      h += '<div class="evidence-row"><span class="mono">' + esc(hhmm(e.at)) + '</span> '
         + esc(e.reading) + ' · <span class="cyan mono">basis=' + esc(e.basis) + '@' + esc(hhmm(e.at)) + '</span></div>';
    }
    h += '</div>';
  }

  /* —— 3.7 钱包簇行：簇未检测到 → 整行不印 —— */
  if (card.cluster){
    const c = card.cluster;
    const t1 = c.spanFrom ? hhmm(c.spanFrom) : hhmm(c.at);
    const t2 = c.spanTo ? hhmm(c.spanTo) : hhmm(c.at);
    const isClose = c.kind === 'EXIT';
    h += '<details class="c-cluster"' + (isVerdict ? ' open' : '') + '>';
    h +=   '<summary class="cluster-head">'
         +   '<span class="mono">' + c.wallets + '</span> 钱包 · 买 <span class="mono">' + esc(money(c.amountUsd)) + '</span>'
         +   ' · 均额 <span class="mono">' + esc(money(Math.round(c.amountUsd / c.wallets))) + '</span>'
         +   ' · <span class="mono">' + t1 + (c.spanTo ? '–' + t2 : '') + '</span>'
         +   ' <span class="chip ' + (isClose ? 'chip-close' : 'chip-open') + '">' + (isClose ? '平仓' : '开仓') + '</span>'
         + '</summary>';
    if (c.perWallet && c.perWallet.length){
      for (let i = 0; i < c.perWallet.length; i += 1){
        const w = c.perWallet[i];
        const pfx = i === c.perWallet.length - 1 ? '└' : '├';
        let line = '<span class="pfx">' + pfx + '</span> <span class="mono">' + esc(w.addr) + '</span> ';
        line += w.mult ? '<span class="mono val">' + esc(w.mult) + '</span> 持 <span class="mono val">' + esc(w.holding) + '</span>' : '';
        line += ' <span class="cyan mono">basis=tokenInfo@' + t + '</span> ';
        if (w.winrate != null){
          line += '胜率 <span class="mono val">' + esc(w.winrate) + '</span> 已实现 '
                + '<span class="mono ' + (w.realized >= 0 ? 'green' : 'red') + '">' + esc(signed(w.realized)) + '</span>';
        } else {
          line += GAP.notFetched('GET /v1/user/wallet_stats w3 未轮到') + GAP_NOTE;
        }
        for (const tag of (w.tags || [])) line += ' <span class="chip">' + esc(tag) + '</span>';
        h += '<div class="wallet-row">' + line + '</div>';
      }
      h += '<div class="wallet-row muted">ⓘ 标签仅并列展示，不作排序键、不作判据（实测有胜率 0.332 的 smart_degen）</div>';
    } else {
      h += '<div class="wallet-row">' + GAP.notFetched(c.perWalletReason || 'GET /v1/user/wallet_stats w3 未轮到') + GAP_NOTE + '</div>';
    }
    h += '</details>';
  }

  /* —— 3.8 早期筹码行：单侧缺失该段不印，四项全缺整行不印；本行不配色 —— */
  if (card.chips){
    const ch = card.chips;
    const seg = (label, s) => {
      if (!s || s.old == null || s.now == null) return '';
      return '<span class="seg">' + label + ' <span class="mono">' + rate(s.old) + ' → ' + rate(s.now) + '</span>'
           + ' <span class="dir">' + dirMark(s.old, s.now) + '</span></span>';
    };
    let line = seg('前70狙击', ch.sniper) + seg('疑似内幕', ch.insider);
    if (ch.bundler != null) line += '<span class="seg">捆绑 <span class="mono">' + rate(ch.bundler) + '</span></span>';
    if (ch.fresh   != null) line += '<span class="seg">新钱包 <span class="mono">' + rate(ch.fresh) + '</span></span>';
    if (line) h += '<div class="c-chips">' + line
      + ' <span class="cyan mono" style="font-size:14px">basis=' + esc(card.source) + '@' + t + '</span></div>';
  }

  /* —— 3.9 DEV 行：BSC 历史发币必然缺失 → 恒显「未检测」，绝不当 0 —— */
  const devHold = card.dev && card.dev.hold != null ? (card.dev.hold * 100).toFixed(1) + '%' : null;
  if (devHold || card.dev.created != null){
    h += '<div class="c-dev' + (card.dev.close ? ' is-risk' : '') + '">'
       + (card.dev.close ? 'DEV 已清仓' : 'DEV 仍在持 <span class="mono">' + devHold + '</span>')
       + ' · 该创建者历史发币 ' + (card.dev.created != null ? '<span class="mono">' + card.dev.created + '</span>'
              : GAP.unchecked('creator_created_count 仅 trenches 有，本卡走 trending，此路由不提供') + GAP_NOTE)
       + '</div>';
  } else if (card.dev && card.dev.hold == null && card.dev.created == null){
    h += '<div class="c-dev">DEV 持仓 ' + GAP.notFetched('本行未返回 creator_token_status') + GAP_NOTE
       + ' · 该创建者历史发币 ' + GAP.unchecked('此路由不提供 creator_created_count') + GAP_NOTE + '</div>';
  }

  /* —— 3.10 安全明细区：顶部无总分、无进度条、无「已通过」 —— */
  const items = securityItems(card);
  const known = items.filter(i => i.known).length;
  h += '<details class="c-security"' + (isVerdict ? ' open' : '') + '>';
  h +=   '<summary class="security-summary">安全 · <span class="mono">' + known + '/' + items.length + '</span> 项已知</summary>';
  h +=   '<div class="security-note">ⓘ 本区不给出总分：任一项未知即为未知。每行右侧为该项读数的来源路由与时刻。</div>';
  for (const it of items){
    h += '<div class="sec-row">'
       +   '<span class="sec-name">' + esc(it.name) + '</span>'
       +   '<span class="sec-val">' + (it.known ? '<span class="mono">' + esc(it.html) + '</span>' : it.html + GAP_NOTE) + '</span>'
       +   '<span class="sec-basis mono">' + esc(it.basis) + '</span>'
       + '</div>';
  }
  if (card.chain === 'bsc'){
    h += '<div class="sec-notapplicable">ⓘ renounced_mint / renounced_freeze_account：BSC 恒返回假值（EVM 无此概念）→ 整行不印</div>';
  } else {
    h += '<div class="sec-notapplicable">ⓘ 蜜罐：SOL 该字段恒 null（概念不适用）→ 整行不印</div>';
  }
  h += '</details>';

  /* —— 时间线 —— */
  if (card.timeline && card.timeline.length){
    h += '<details class="c-timeline"><summary>时间线（' + card.timeline.length + '）</summary>';
    for (const e of card.timeline){
      h += '<div class="timeline-row"><span class="mono">' + esc(hhmm(e.at)) + '</span> ' + esc(e.text)
         + ' · <span class="cyan mono">basis=' + esc(e.basis) + '@' + esc(hhmm(e.at)) + '</span></div>';
    }
    h += '</details>';
  }

  /* —— 战绩行：样本不足/未到期必须诚实显示「待读」，不显示 0 —— */
  const perfMult = mult(card.snap.marketCap, card.latest.marketCap);
  const sinceSignal = Math.max(0, Math.round((NOW_MS - (card.perf ? card.perf.at : card.lastAt)) / 60000));
  h += '<div class="c-score">首见起 <span class="mono">' + (perfMult ? esc(perfMult) : '倍数不可算') + '</span>'
     + '（T+' + sinceSignal + 'm，未完成 T+24h）· ' + GAP.pendingRead('outcomes 样本 0，T+24h 未到期；不得显示 0 或空白')
     + ' <span class="cyan mono" style="font-size:14px">basis=本地投影@' + t + '</span></div>';

  /* —— 3.11 行动区：只有三个按钮，无下单 —— */
  h += '<div class="c-actions">';
  h +=   '<button class="mini-btn" type="button" data-act="copy" data-addr="' + esc(card.address) + '">复制链接</button>';
  h +=   '<a class="mini-btn mini-btn-link" href="' + esc(sourceUrl(card)) + '" target="_blank" rel="noopener noreferrer">打开数据源页面</a>';
  h +=   '<button class="mini-btn" type="button" data-act="mark" data-addr="' + esc(card.address) + '">手动划掉</button>';
  h += '</div>';

  h += '</article>';
  return h;
}

/* ============================================================================
   C7 今日淘汰清单（同一网格的第 4 个分段）
   ============================================================================ */
function manualStruck(){
  return Object.keys(marks).filter(a => marks[a].mark === 'drop').map(a => {
    const card = CARDS.find(c => c.address === a);
    return { symbol: card ? card.symbol : a.slice(0, 8), address: a, chain: card ? card.chain : 'bsc',
             at: marks[a].at || NOW_MS, kind: 'MANUAL', mc: null,
             reason: '我划掉的（人说的，可撤销）', stillTracked: true, manual: true };
  });
}
/* 报数与淘汰清单同源：两者都走这个函数，保证 C2 的「已划掉 n」与 C7 的「今日已划掉（n）」逐字相等 */
function allStruck(){
  return STRUCK.filter(r => r.chain === viewChain)
    .concat(manualStruck().filter(r => r.chain === viewChain));
}

const KIND_LABEL = { VETO:'否决', ZEROED:'归零', QUIET:'无动静', STALE:'停滞', MANUAL:'我划掉的' };

function renderStruckRows(){
  const rows = allStruck();
  let h = '<div class="struck-list">';
  for (const r of rows){
    const tail = r.manual ? '已移入淘汰清单（可撤销）'
               : (r.stillTracked ? '仍在观察集合（保留锚点）' : '已移出观察集合');
    h += '<div class="struck-row" data-struck="' + esc(r.address) + '" role="button" tabindex="0"'
       + ' aria-expanded="false" title="点击展开该条的原因明细">';
    h +=   '<span class="s-sym">' + esc(r.symbol) + '</span>';
    h +=   '<span class="s-addr mono">' + esc(shortAddr(r.address)) + '</span>';
    h +=   '<span><span class="chip chip-' + r.kind.toLowerCase() + '">' + KIND_LABEL[r.kind] + '</span></span>';
    h +=   '<span class="s-clock mono">' + esc(hhmm(r.at)) + '</span>';
    h +=   '<span class="s-tail">' + esc(tail) + '</span>';
    h +=   r.manual ? '<button class="mini-btn" type="button" data-act="undo" data-addr="' + esc(r.address) + '">撤销</button>' : '<span></span>';
    h += '</div>';
    h += '<div class="struck-reasons" hidden>划掉原因：' + esc(r.reason)
       + ' · 时刻 <span class="mono">' + esc(hhmm(r.at)) + '</span>'
       + (r.mc != null ? ' · 首见市值 <span class="mono">' + esc(money(r.mc)) + '</span>' : '')
       + ' · <span class="cyan mono">basis=本地投影@' + esc(hhmm(r.at)) + '</span></div>';
  }
  h += '</div>';
  return h;
}

/* ============================================================================
   C1 结论层
   ============================================================================ */
function renderVerdict(){
  const f = flags();
  const bar = $('verdictBar');
  bar.classList.toggle('is-disabled', f.conflict);
  bar.classList.toggle('is-stale', f.banned);

  const cards = CARDS.filter(c => c.group === 'verdict' && c.chain === viewChain && !marks[c.address]);
  const order = cards.slice().sort((a, b) => a.verdictRank - b.verdictRank);

  if (f.scanning){
    $('verdictTitle').textContent = '今天该看的';
    $('verdictHint').textContent = '正在读取本地雷达状态 · 第 ' + SCAN_COUNT + ' 轮';
    $('verdictList').innerHTML = '<div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div>';
    $('verdictTail').textContent = '';
    return;
  }
  if (f.coldstart){
    $('verdictTitle').textContent = '今天该看的（0 / 上限 5）';
    $('verdictHint').textContent = '还没有任何观察记录';
    $('verdictList').innerHTML = '';
    $('verdictTail').textContent = '第一轮的发现会在下一次扫描后出现（预计 ' + hhmm(NEXT_MS) + '）。这是冷启动，不是故障。';
    return;
  }
  if (f.empty){
    $('verdictTitle').textContent = '今天没有能下手的（0 / 上限 5）';
    $('verdictHint').textContent = '这不是没数据：' + viewChain.toUpperCase() + ' 本轮 trenches 19 行、trending 50 行，全部未过门槛';
    $('verdictList').innerHTML = '';
    $('verdictTail').textContent = '原因：无候选 0 · 全部被否决 ' + allStruck().filter(r => r.kind === 'VETO').length
      + ' · 数据停摆中 否；下一轮 ' + hhmm(NEXT_MS) + '。不用老池/热榜补位。';
    return;
  }

  $('verdictTitle').textContent = '今天该看的（' + order.length + ' / 上限 5）';
  $('verdictHint').textContent = '理由里的每个数字都能在下方卡片上指到；回车 → 滚到那张卡';

  let h = '';
  for (const c of order){
    h += '<li class="verdict-row" data-target="' + esc(c.key) + '" tabindex="0" role="link"'
       + ' aria-label="滚到 ' + esc(c.symbol) + ' 的卡片">';
    h +=   '<span class="vrank mono">' + c.verdictRank + '</span>';
    h +=   '<span class="vsym">' + esc(c.symbol) + '<span class="chain-tag">' + c.chain.toUpperCase() + '</span></span>';
    h +=   '<span><span class="badge badge-' + c.grade.toLowerCase() + '">' + c.grade + '</span> '
       +   '<span class="badge badge-quad quad-' + c.quadrant.toLowerCase() + '">'
       +   ({ WATCH:'观察', BREAKOUT:'真启动', DISTRIBUTION:'出货', POOL_PULLED:'撤池' }[c.quadrant] || c.quadrant) + '</span></span>';
    h +=   '<span class="vreason">' + esc(verdictReason(c)) + '</span>';
    h +=   '<span class="vgo">→</span>';
    h += '</li>';
  }
  $('verdictList').innerHTML = h;

  let tail = '另有 0 个达到门槛未列入，见下方网格';
  if (f.banned) tail = '⚠ 此结论基于 ' + hhmm(NOW_MS) + ' 的快照 · ' + tail;
  if (f.conflict) tail = '本轮结论暂不可用，原因：表头与投影不一致（点击已禁用）';
  $('verdictTail').textContent = tail;
}

/* ============================================================================
   C2 报数行（四项成对全印，即使为 0 也印 0）
   ============================================================================ */
function renderLedger(){
  const f = flags();
  const el = $('ledger');
  const chainCards = CARDS.filter(c => c.chain === viewChain && !marks[c.address]);
  const onBoard   = chainCards.length;
  const newPools  = viewChain === 'bsc' ? 81 : 0;
  const struck    = allStruck();
  const vetoN     = struck.filter(r => r.kind === 'VETO').length;
  const quietN    = struck.filter(r => r.kind === 'QUIET').length;
  const staleN    = struck.filter(r => r.kind === 'STALE').length;
  const zeroedN   = 0;                 // 本轮归零 0 —— 四项成对全印，0 也要印
  const keptNoData = viewChain === 'bsc' ? 6 : 1;
  const grades = { S:0, A:0, B:0, C:0, D:0 };
  for (const c of chainCards) if (grades[c.grade] != null) grades[c.grade] += 1;
  const quadrants = {};
  for (const c of chainCards) quadrants[c.quadrant] = (quadrants[c.quadrant] || 0) + 1;

  el.classList.toggle('is-frozen', f.degraded || f.banned);
  el.classList.toggle('is-conflict', f.conflict);

  if (f.scanning){
    el.innerHTML = '<div class="skeleton-block" style="width:60%"></div>'
                 + '<div class="skeleton-block" style="width:80%;margin-top:8px"></div>'
                 + '<div class="skeleton-block" style="width:50%;margin-top:8px"></div>';
    return;
  }

  const zero = f.coldstart;
  const L = (label, n, cls) => '<span><span class="label">' + label + '</span> <span class="n mono ' + (cls || '') + '">'
          + (zero ? 0 : n) + '</span></span>';

  let h = '';
  if (f.conflict) h += '<div class="ledger-line"><span class="ledger-conflict-prefix">⚠ 口径异常</span>'
    + '<span>表头报 9 条，投影实测 11 条；不自动修正数字，结论层已置灰禁用</span></div>';
  h += '<div class="ledger-line">'
     + L('板上', onBoard) + L('新池未上板', newPools)
     + L('已划掉', struck.length, 'n-struck')
     + L('因无数据保留', keptNoData, 'n-kept') + '</div>';
  h += '<div class="ledger-line"><span class="label">评级</span> '
     + '<span class="n mono">S' + (zero ? 0 : grades.S) + ' A' + (zero ? 0 : grades.A) + ' B' + (zero ? 0 : grades.B)
     + ' C' + (zero ? 0 : grades.C) + ' D' + (zero ? 0 : grades.D) + '</span>'
     + '<span class="label">象限</span> ';
  for (const q in quadrants) h += '<span class="n mono">' + q + ' ' + (zero ? 0 : quadrants[q]) + '</span> ';
  h += '<span class="label">' + viewChain.toUpperCase() + ' 新池供给</span> '
     + '<span class="n mono">' + (viewChain === 'bsc' ? '1/100' : '0/0') + '</span>'
     + '<span class="label">过门槛（本轮）</span>' + (viewChain === 'sol' ? '<span class="label">本轮未采此链</span>' : '')
     + '</div>';
  h += '<div class="ledger-line"><span class="label">上一轮清掉了什么：</span>'
     + L('归零', zeroedN, 'n-zero') + L('否决', vetoN, 'n-veto')
     + L('无动静', quietN, 'n-zero') + L('停滞', staleN, 'n-zero') + '</div>';
  if (f.degraded || f.banned) h += '<div class="ledger-line"><span class="amber">读数停于 ' + hhmm(NOW_MS) + '</span></div>';
  el.innerHTML = h;
}

/* ============================================================================
   唯一的币种网格（4 个分段 + 淘汰清单分段）
   ============================================================================ */
function renderBoard(){
  const f = flags();
  const grid = $('tokenGrid');

  if (f.scanning){
    grid.innerHTML = '<div class="token-cards">'
      + '<div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div></div>'
      + '<div class="empty-note" style="margin-top:12px">正在读取本地雷达状态 · 第 ' + SCAN_COUNT + ' 轮</div>';
    return;
  }
  if (f.coldstart){
    grid.innerHTML = '<div class="empty-note">还没有任何观察记录。第一轮的发现会在下一次扫描后出现（预计 ' + hhmm(NEXT_MS) + '）。</div>';
    return;
  }

  const pool = CARDS.filter(c => c.chain === viewChain && !marks[c.address]);
  const GROUPS = [
    { id:'verdict', title:'结论组', open:true },
    { id:'risk',    title:'风险组', open:true },
    { id:'chance',  title:'机会组', open:true },
    { id:'watch',   title:'观察组', open:true }
  ];
  let h = '';
  for (const g of GROUPS){
    const cards = pool.filter(c => c.group === g.id);
    const cap = g.id === 'verdict' ? ' · 上限 5' : '';
    h += '<details class="grid-section" data-group="' + g.id + '"' + (g.open ? ' open' : '') + '>';
    h +=   '<summary class="grid-section-head">' + g.title + '（<span class="count mono">' + cards.length + '</span>' + cap + '）</summary>';
    h +=   '<div class="token-cards">' + (cards.length ? cards.map(renderCard).join('') : '<div class="empty-note">本组 0 个</div>') + '</div>';
    h += '</details>';
  }

  /* C7 同一网格末尾的折叠分段（默认折叠） */
  const struck = allStruck();
  h += '<details class="grid-section" data-group="struck" id="struckSection"' + (showStruckFlag ? '' : ' hidden') + '>';
  h +=   '<summary class="grid-section-head">今日已划掉（<span class="count mono">' + struck.length + '</span>）'
       + '<span class="count">否决 ' + struck.filter(r => r.kind === 'VETO').length
       + ' · 归零 0 · 无动静 ' + struck.filter(r => r.kind === 'QUIET').length
       + ' · 停滞 ' + struck.filter(r => r.kind === 'STALE').length
       + ' · 我划掉的 ' + struck.filter(r => r.kind === 'MANUAL').length + '</span></summary>';
  h +=   renderStruckRows();
  h += '</details>';

  grid.innerHTML = h;
}

/* ============================================================================
   C5 源健康面板
   ============================================================================ */
function renderHealth(){
  const f = flags();
  const panel = $('healthPanel');
  const routeState = (r) => {
    if (f.banned) return 'DOWN';
    if (f.degraded && r.status === 'READY' && r.consecFail === 0 && r.route.indexOf('token/info') >= 0) return 'DEGRADED';
    if (f.degraded && r.route.indexOf('token/info') >= 0) return 'DEGRADED';
    return r.status;
  };
  const rows = HEALTH.map(r => ({ r, st: routeState(r) }));
  const abnormal = rows.filter(x => x.st === 'DOWN' || x.st === 'DEGRADED').length;

  const pill = (st) => {
    const map = { READY:'pill-ready', DEGRADED:'pill-degraded', DOWN:'pill-down', NOT_WIRED:'pill-notwired' };
    return '<span class="pill ' + (map[st] || 'pill-notwired') + '"></span>';
  };
  const statusWord = { READY:'READY', DEGRADED:'DEGRADED', DOWN:'DOWN', NOT_WIRED:'NOT_WIRED' };

  let h = '<summary>源健康<span class="count">' + HEALTH.length + ' 通道 · '
        + (abnormal ? abnormal + ' 条异常' : '0 条异常') + '</span></summary>';
  h += '<div class="panel-note">ⓘ 单源化后「该源不提供哪些字段」比「它提供了什么」更重要；下表最后一列逐通道报出。</div>';
  h += '<div class="table-scroll"><table><thead><tr>'
     + '<th>路由</th><th>状态</th><th>最后成功</th><th>窗口 / 滞后</th><th>本轮权重</th><th>连续失败</th><th>该通道不提供的字段</th>'
     + '</tr></thead><tbody>';
  for (const x of rows){
    h += '<tr><td class="mono">' + esc(x.r.route) + '</td>'
       + '<td>' + pill(x.st) + esc(statusWord[x.st]) + '</td>'
       + '<td class="mono">' + (x.r.lastOk ? esc(hhmm(x.r.lastOk)) : '未取到 ?') + '</td>'
       + '<td class="mono">' + esc(x.r.window) + '</td>'
       + '<td class="num mono">' + esc(x.r.weight === '—' ? x.r.used + ' / 上限 40' : x.r.weight) + '</td>'
       + '<td class="num mono">' + (f.banned ? 6 : x.r.consecFail) + '</td>'
       + '<td class="muted">' + esc(x.r.notProvide) + '</td></tr>';
  }
  h += '<tr><td class="mono muted" style="text-decoration:line-through">' + esc(HEALTH_RETIRED.name) + '</td>'
     + '<td><span class="pill pill-retired"></span>RETIRED</td>'
     + '<td class="muted">已退役</td><td class="muted">已退役</td>'
     + '<td class="num muted">已退役</td><td class="num muted">已退役</td>'
     + '<td class="muted">🔴 ' + esc(HEALTH_RETIRED.name) + ' 已于 ' + esc(HEALTH_RETIRED.date) + ' 退役（原贡献 '
     + esc(HEALTH_RETIRED.pct) + '，' + esc(HEALTH_RETIRED.why) + '）</td></tr>';
  h += '</tbody></table></div>';
  h += '<div class="panel-note">配额/退避：本轮 17 / 上限 40 权重 · minGap 2200ms · 退避档位 '
     + (f.banned ? 'BANNED（RATE_LIMIT_BANNED · 禁冷却期重试）' : '0') + '</div>';
  if (f.banned) h += '<div class="panel-note red">⚠ 本轮 pump 桶 0 行（该生命周期段无供给）</div>';

  panel.innerHTML = h;
  panel.classList.toggle('is-abnormal', abnormal > 0);
  panel.open = abnormal > 0;   // 异常自动展开，summary 上异常报数永久保留
}

/* ============================================================================
   C10 L1 Toast
   ============================================================================ */
let toastTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('is-on');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('is-on'), 3000);
}

/* ============================================================================
   交互
   ============================================================================ */
function scrollToCard(key){
  const el = document.querySelector('[data-card-key="' + key + '"]');
  if (!el) return;
  el.scrollIntoView({ block: 'center' });
  el.classList.remove('is-target');
  void el.offsetWidth;                       // 重启动画
  el.classList.add('is-target');
  document.querySelectorAll('[aria-current="true"]').forEach(n => n.removeAttribute('aria-current'));
  el.setAttribute('aria-current', 'true');
  setTimeout(() => el.removeAttribute('aria-current'), 3000);
}

function bindVerdict(){
  $('verdictList').addEventListener('click', (e) => {
    if (flags().conflict) return;            // S8 结论层点击禁用
    const row = e.target.closest('.verdict-row');
    if (row) scrollToCard(row.getAttribute('data-target'));
  });
  $('verdictList').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' '){
      const row = e.target.closest('.verdict-row');
      if (row){ e.preventDefault(); if (!flags().conflict) scrollToCard(row.getAttribute('data-target')); }
    }
  });
}

function bindBoard(){
  const grid = $('tokenGrid');
  grid.addEventListener('click', (e) => {
    const t = e.target;

    /* 行动区：复制 / 手动划掉 / 撤销手动划掉 */
    const btn = t.closest('[data-act]');
    if (btn){
      const act = btn.getAttribute('data-act');
      const addr = btn.getAttribute('data-addr');
      if (act === 'copy'){
        navigator.clipboard && navigator.clipboard.writeText
          ? navigator.clipboard.writeText(addr).then(() => toast('已复制 ' + shortAddr(addr)), () => toast('复制失败，请手动选中地址'))
          : toast('请手动复制地址：' + shortAddr(addr));
      } else if (act === 'mark'){
        marks[addr] = { mark: 'drop', note: '', at: Date.now() };
        saveMarks(marks);
        toast('已手动划掉 ' + shortAddr(addr) + ' · 可在「今日已划掉」里撤销');
        renderAll();
      } else if (act === 'undo'){
        delete marks[addr];
        saveMarks(marks);
        toast('已撤销手动划掉 · 该卡回到原分组');
        renderAll();
      }
      return;
    }

    /* 淘汰清单：点击行展开原因明细（不复制卡片、不开新面板） */
    const row = t.closest('.struck-row');
    if (row){
      const detail = row.nextElementSibling;
      if (detail && detail.classList.contains('struck-reasons')){
        const open = !detail.hidden;
        detail.hidden = open;
        row.setAttribute('aria-expanded', String(!open));
      }
    }
  });

  grid.addEventListener('keydown', (e) => {
    const row = e.target.closest('.struck-row');
    if (row && (e.key === 'Enter' || e.key === ' ')){
      e.preventDefault();
      const detail = row.nextElementSibling;
      if (detail && detail.classList.contains('struck-reasons')){
        const open = !detail.hidden;
        detail.hidden = open;
        row.setAttribute('aria-expanded', String(!open));
      }
    }
  });
}

  $('chainSwitch').addEventListener('click', (e) => {
    const b = e.target.closest('[data-chain]');
    if (!b) return;

  $('sortSelect').addEventListener('change', (e) => { sortMode = e.target.value; toast('排序已切换为「' + e.target.selectedOptions[0].text + '」（不改变哪些币被划掉）'); });

function bindKeys(){
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input, select, textarea')) return;
    if (e.key >= '1' && e.key <= '5'){
      const row = document.querySelector('.verdict-row[data-target]');
      const rows = document.querySelectorAll('.verdict-row[data-target]');
      const idx = Number(e.key) - 1;
      if (rows[idx] && !flags().conflict) scrollToCard(rows[idx].getAttribute('data-target'));
      return;
    }
    if (e.key === 's'){ const p = $('healthPanel'); p.open = !p.open; return; }
    if (e.key === '?'){ toast('快捷键：1-5 跳结论行 · j/k 上下卡 · e 展开/收起 · c 复制地址 · m 手动划掉 · s 源健康 · Esc 收起'); return; }
    if (e.key === 'e'){
      const card = document.querySelector('.card[aria-current="true"]') || document.querySelector('.card');
      if (card){
        const ds = card.querySelectorAll('details');
        const anyClosed = Array.prototype.some.call(ds, d => !d.open);
        ds.forEach(d => { d.open = anyClosed; });
        toast(anyClosed ? '已展开该卡全部区块' : '已收起该卡全部区块');
      }
      return;
    }
    if (e.key === 'c'){
      const card = document.querySelector('.card[aria-current="true"]') || document.querySelector('.card');
      if (card){
        const addr = card.querySelector('[data-act="copy"]').getAttribute('data-addr');
        navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(addr).then(() => toast('已复制 ' + shortAddr(addr))) : toast('请手动复制地址');
      }
      return;
    }
    if (e.key === 'm'){
      const card = document.querySelector('.card[aria-current="true"]') || document.querySelector('.card');
      if (card){
        const addr = card.querySelector('[data-act="mark"]').getAttribute('data-addr');
        marks[addr] = { mark: 'drop', note: '', at: Date.now() };
        saveMarks(marks);
        toast('已手动划掉 ' + shortAddr(addr));
        renderAll();
      }
      return;
    }
    if (e.key === 'j' || e.key === 'k'){
      const cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
      if (!cards.length) return;
      const cur = cards.findIndex(c => c.getAttribute('aria-current') === 'true');
      const next = e.key === 'j' ? Math.min(cards.length - 1, cur + 1) : Math.max(0, cur - 1);
      const target = cards[cur === -1 ? 0 : next];
      target.setAttribute('aria-current', 'true');
      target.scrollIntoView({ block: 'center' });
      return;
    }
    if (e.key === 'Escape'){ document.querySelectorAll('.card[aria-current="true"]').forEach(c => c.removeAttribute('aria-current')); }
  });
}

/* ============================================================================
   原型元控件：状态演示切换器 + 验收对照
   ============================================================================ */
function renderStateSwitcher(){
  const wrap = $('stateSwitcher');
  wrap.innerHTML = Object.keys(STATES).map(k =>
    '<button class="proto-btn" type="button" data-state="' + k + '" aria-pressed="' + (currentState === k) + '">'
    + STATES[k].label + '</button>').join('');
  $('stateDesc').textContent = STATES[currentState].desc;
  wrap.onclick = (e) => {
    const b = e.target.closest('[data-state]');
    if (!b) return;
    currentState = b.getAttribute('data-state');
    renderAll();
  };
}

function renderAccept(){
  $('acceptList').innerHTML = ACCEPT.map(a =>
    '<label class="accept-item"><input type="checkbox" data-accept="' + a[0] + '">'
    + '<span class="no">' + a[0] + '</span><span>' + esc(a[1]) + '</span></label>').join('');
  const boxes = $('acceptList').querySelectorAll('input[type=checkbox]');
  const upd = () => {
    const n = $('acceptList').querySelectorAll('input:checked').length;
    $('acceptProgress').textContent = '已判定 ' + n + ' / ' + boxes.length + ' 条为真（亲手勾选，不是我替你判的）';
  };
  boxes.forEach(b => b.addEventListener('change', upd));
  upd();
}

/* ============================================================================
   总渲染
   ============================================================================ */
function renderAll(){
  renderStateSwitcher();
  renderTopbar();
  renderAlerts();
  renderVerdict();
  renderLedger();
  renderBoard();
  renderHealth();
  renderWallets();
  renderReview();
}

renderAll();
renderAccept();
bindVerdict();
bindBoard();
bindTopbar();
bindKeys();
</script>
